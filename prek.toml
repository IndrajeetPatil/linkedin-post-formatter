minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "539ea2e1c5a0eb8adeb5fe0b1e2eb66fa5827042" # frozen: v0.3.5
hooks = [{ id = "rumdl-check" }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0
hooks = [
  # Strict mode also checks merge and fixup messages.
  { id = "conventional-pre-commit", stages = ["commit-msg"], args = ["--strict", "--verbose"] },
]

[[repos]]
repo = "local"

# Type-aware linting resolves the app's own dependencies, so this hook runs
# against the locked node_modules from `vp install`.
[[repos.hooks]]
id = "vite-plus"
name = "Vite+ format, lint, and types"
language = "system"
entry = "vp check --deny-warnings"
files = "\\.([cm]?[jt]sx?|json|css|html|md|ya?ml|toml)$"
pass_filenames = false

# Staged-diff secret scan with gitleaks; CI scans full history.
[[repos.hooks]]
id = "gitleaks"
name = "gitleaks (staged secret scan)"
language = "system"
entry = "gitleaks git --pre-commit --redact --staged --verbose"
pass_filenames = false

# Spelling with typos over the whole tree.
[[repos.hooks]]
id = "typos"
name = "typos (spelling)"
language = "system"
entry = "typos"
pass_filenames = false
types = ["text"]

# Submodules are not allowed.
[[repos.hooks]]
id = "forbid-submodules"
name = "forbid submodules"
language = "fail"
entry = "submodules are not allowed in this repository:"
types = ["directory"]

[[repos.hooks]]
id = "typecheck"
name = "TypeScript type check"
language = "system"
entry = "vp run typecheck"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "test"
name = "Unit tests with coverage (Vitest)"
language = "system"
entry = "vp run test"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  # tsconfig.json is JSONC.
  { id = "check-json", exclude = "^tsconfig\\.json$" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-illegal-windows-names" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
