minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0
hooks = [
  # Strict mode also checks merge and fixup messages.
  { id = "conventional-pre-commit", stages = ["commit-msg"], args = ["--strict", "--verbose"] },
]

[[repos]]
repo = "local"

# Type-aware linting resolves the app's own dependencies, so this hook runs
# against the locked node_modules from `vp install`.
[[repos.hooks]]
id = "vite-plus"
name = "Vite+ format, lint, and types"
language = "system"
entry = "vp check"
files = "\\.([cm]?[jt]sx?|json|css|html|md|ya?ml|toml)$"
pass_filenames = false

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  # tsconfig.json is JSONC.
  { id = "check-json", exclude = "^tsconfig\\.json$" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-illegal-windows-names" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
