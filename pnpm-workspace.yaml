catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"

# Refuse to install under a Node or pnpm older than package.json's `engines`;
# without this pnpm only warns, so a stale local Node quietly builds the site
# with different semantics from CI. pnpm 11+ ignores this setting in .npmrc.
engineStrict: true
