name: Pages

# Builds the app and publishes it on GitHub Pages from `main`. It can also be
# started by hand.
on:
  push:
    branches: [main]
    # Nothing here changes the published site.
    paths-ignore:
      - "docs/**"
      - "hextools/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/prompts/**"
      - ".github/dependabot.yml"
      - ".github/workflows/actions.lock"
      - "*.md"
      - "prek.toml"
      - "skills-lock.json"
      - "scripts/actions-lock.sh"
      - "scripts/record-demo.mjs"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# One deployment at a time; a running deployment is never cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches: a published build must not restore anything another
      # workflow could have written.
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: false
          cache-toolchain: false
          run-install: |
            args: [--frozen-lockfile]

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Build Pyodide wheels
        run: vp run wheels

      # Pages serves a project site from /<repository>/.
      - name: Build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: vp build

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
