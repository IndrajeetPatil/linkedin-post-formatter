name: CI

# Every change reaches `main` through a pull request, so QA and tests run only
# on pull requests; pushes to `main` only deploy (see pages.yml).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change can affect the app. Jobs are skipped with `if`
  # rather than the workflow being filtered by `paths`, because a skipped job
  # still satisfies a required status check and a filtered workflow does not.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Anything not listed as inert counts as an app change, so a new kind of
      # file runs the full suite until it is added here. Markdown only counts
      # as inert outside `src/`, where `sample.md` is bundled into the app.
      - name: Filter changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          app=false
          while IFS= read -r file; do
            case "$file" in
              src/*) app=true ;;
              docs/* | hextools/* | .agents/* | .claude/* | .github/prompts/* | \
                .github/dependabot.yml | .github/workflows/actions.lock | \
                LICENSE.md | prek.toml | skills-lock.json | scripts/actions-lock.sh | \
                scripts/record-demo.mjs | _typos.toml | .rumdl.toml | lychee.toml) ;;
              */*) app=true ;;
              *.md) ;;
              *) app=true ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Changes affect the app: $app"

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Actions lockfile (gh actions-lock --verify)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.0
          scripts/actions-lock.sh --verify

      # Prebuilt Rust and Go binaries install in seconds, unlike Node-based
      # equivalents. Each archive is verified against a pinned SHA-256.
      - name: Install pinned QA tools
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          TYPOS_VERSION: "1.52.2"
          TYPOS_SHA256: 3b13d1291281d39d01822e54035636487a7a0f228e70097899b1e33aeb0e7e93
          RUMDL_VERSION: "0.3.5"
          RUMDL_SHA256: 47acba7706ff7a57aa38ecacde5953dacd411feca4d36e2d6c994b1a33253ec4
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: "1.32.0"
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          bin_dir="$RUNNER_TEMP/qa-bin"
          mkdir -p "$bin_dir"

          install_tool() {
            local name="$1" url="$2" sha256="$3"
            local archive="$RUNNER_TEMP/$name.tar.gz" unpack="$RUNNER_TEMP/$name-unpack"
            curl --fail --location --silent --show-error --retry 3 --output "$archive" "$url"
            echo "$sha256  $archive" | sha256sum --check --quiet
            mkdir -p "$unpack"
            tar --extract --gzip --file "$archive" --directory "$unpack"
            install -m 0755 "$(find "$unpack" -type f -name "$name" -print -quit)" "$bin_dir/$name"
          }

          gh_release="https://github.com"
          install_tool lychee "$gh_release/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" "$LYCHEE_SHA256"
          install_tool typos "$gh_release/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$TYPOS_SHA256"
          install_tool rumdl "$gh_release/rvben/rumdl/releases/download/v${RUMDL_VERSION}/rumdl-v${RUMDL_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$RUMDL_SHA256"
          install_tool gitleaks "$gh_release/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          install_tool actionlint "$gh_release/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          install_tool zizmor "$gh_release/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"

          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Start link check (lychee)
        id: lychee-start
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The inner script expands its own variables, so it is single-quoted.
          # shellcheck disable=SC2016
          nohup bash -c 'lychee --no-progress --include-fragments --require-https . > "$RUNNER_TEMP/lychee.log" 2>&1; echo "$?" > "$RUNNER_TEMP/lychee.status"' \
            > /dev/null 2>&1 &

      - name: Spelling (typos)
        run: typos --color always

      - name: Markdown lint (rumdl)
        run: rumdl check --color always .

      - name: Workflow lint (actionlint)
        run: actionlint -color

      - name: Workflow audit (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --color=always .github/workflows/

      - name: Secret scan (Gitleaks)
        run: gitleaks git --log-opts="--all" --no-banner --redact --verbose --log-level=warn .

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: false
          cache-toolchain: false
          run-install: |
            args: [--frozen-lockfile]

      # A hook that rewrites a file fails the step.
      - name: prek hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          extra-args: --all-files --stage pre-commit
        env:
          # The next step runs the same `vp check`; don't run it twice.
          SKIP: vite-plus

      - name: Format, lint, and types (vp run check)
        run: vp run check

      - name: TypeScript types (vp run typecheck)
        run: vp run typecheck

      - name: Unit tests and coverage (vp run test)
        run: vp run test

      - name: Dependency audit (production)
        run: vp pm audit -- --prod

      - name: Link check (lychee)
        if: ${{ !cancelled() && steps.lychee-start.outcome == 'success' }}
        run: |
          for _ in $(seq 1 300); do
            [[ -f "$RUNNER_TEMP/lychee.status" ]] && break
            sleep 2
          done
          [[ -f "$RUNNER_TEMP/lychee.status" ]] || {
            echo "::error::lychee did not finish within 10 minutes"
            cat "$RUNNER_TEMP/lychee.log"
            exit 1
          }
          cat "$RUNNER_TEMP/lychee.log"
          exit "$(cat "$RUNNER_TEMP/lychee.status")"

  # Only the browser suite is skipped for inert changes; `check` still runs
  # because `vp check` formats Markdown too. The caches below are saved per pull
  # request, so they speed up later pushes and reruns within the same one.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: false
          cache-toolchain: false
          run-install: |
            args: [--frozen-lockfile]

      - name: Read tool versions
        id: versions
        run: |
          echo "pyodide=$(node -p 'require("pyodide/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # The wheels depend only on the Pyodide release, the requirements, and
      # the build script, so a rebuild is needed only when one of them changes.
      - name: Restore Pyodide wheels
        id: wheels-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/wheels
          key: wheels-${{ runner.os }}-pyodide-${{ steps.versions.outputs.pyodide }}-${{ hashFiles('wheels/requirements.txt', 'scripts/build-wheels.sh') }}

      - name: Install uv
        if: ${{ steps.wheels-cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build Pyodide wheels
        if: ${{ steps.wheels-cache.outputs.cache-hit != 'true' }}
        run: vp run wheels

      # Only the browser downloads are cached; `--with-deps` still installs
      # the system libraries, and skips browsers that are already present.
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}

      # Playwright's WebKit binary requires Ubuntu 24.04 (noble) libraries
      # (libicu74 and libxml2.so.2) that Ubuntu 26.04 (ubuntu-latest) replaced
      # with libicu78 and libxml2-16.
      - name: Install WebKit system dependencies
        run: |
          echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu noble main noble-updates" | sudo tee /etc/apt/sources.list.d/noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu74 libxml2

      - name: Install browsers
        run: vp exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: vp run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
