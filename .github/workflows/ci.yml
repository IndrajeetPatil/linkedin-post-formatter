name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: false
          cache-toolchain: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format, lint, and type-check
        run: vp check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: false
          cache-toolchain: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Read tool versions
        id: versions
        run: |
          echo "pyodide=$(node -p 'require("pyodide/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # The wheels depend only on the Pyodide release, the requirements, and
      # the build script, so a rebuild is needed only when one of them changes.
      - name: Restore Pyodide wheels
        id: wheels-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/wheels
          key: wheels-${{ runner.os }}-pyodide-${{ steps.versions.outputs.pyodide }}-${{ hashFiles('wheels/requirements.txt', 'scripts/build-wheels.sh') }}

      - name: Install uv
        if: ${{ steps.wheels-cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build Pyodide wheels
        if: ${{ steps.wheels-cache.outputs.cache-hit != 'true' }}
        run: vp run wheels

      # Only the browser downloads are cached; `--with-deps` still installs
      # the system libraries, and skips browsers that are already present.
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}

      - name: Install browsers
        run: vp exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: vp run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
