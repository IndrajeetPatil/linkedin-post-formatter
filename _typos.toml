# typos spell-checker configuration
# Docs: https://github.com/crate-ci/typos

[default]
locale = "en-gb"

[files]
extend-exclude = [
  "coverage/**",
  "dist/**",
  "src/wheels/**",
  "playwright-report/**",
  "test-results/**",
]

[default.extend-identifiers]
# Standard JavaScript String method; the API name cannot use British spelling.
normalize = "normalize"
# Tiptap's MarkdownManager method.
serialize = "serialize"

[default.extend-words]
# CSS properties and values — American English is mandated by the CSS specification
color = "color"
colors = "colors"
Color = "Color"
Colors = "Colors"
center = "center"
Center = "Center"
capitalize = "capitalize"
behavior = "behavior"
# Tooling and API keywords that cannot use British spelling
catalog = "catalog"
Catalog = "Catalog"
capitalized = "capitalized"
optimize = "optimize"
